<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Мои SIM-карты</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-[var(--tg-theme-bg-color)] text-[var(--tg-theme-text-color)] min-h-screen">
    <div class="container mx-auto p-4 pb-24 max-w-2xl">
        <h1 class="text-2xl font-bold mb-4">📱 Мои SIM-карты</h1>

        <div id="loading" class="text-center py-8 opacity-60">Загрузка...</div>
        <div id="empty-state" class="hidden text-center py-16 opacity-60">
            <p class="text-4xl mb-2">📭</p>
            <p>Пока нет добавленных карт</p>
            <p class="text-sm mt-2">Нажмите «Добавить номер» снизу</p>
        </div>
        <div id="cards-list" class="space-y-3"></div>
    </div>

    <!-- Модальное окно формы -->
    <div id="modal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-end md:items-center justify-center p-4">
        <div class="bg-[var(--tg-theme-bg-color)] w-full max-w-md rounded-2xl p-5 border border-[var(--tg-theme-hint-color)]/30">
            <h2 id="modal-title" class="text-xl font-bold mb-4">Добавить карту</h2>
            <form id="card-form" class="space-y-3">
                <input type="hidden" id="card-id">
                <div>
                    <label class="block text-sm mb-1 opacity-80">Номер телефона</label>
                    <input type="text" id="phone" inputmode="tel" placeholder="+371 2XXXXXXX" required
                        class="w-full px-3 py-2 rounded-lg bg-[var(--tg-theme-secondary-bg-color)] border border-[var(--tg-theme-hint-color)]/40 focus:outline-none focus:border-[var(--tg-theme-button-color)]">
                </div>
                <div>
                    <label class="block text-sm mb-1 opacity-80">Баланс (€)</label>
                    <input type="number" id="balance" step="0.01" min="0" placeholder="11.44" required
                        class="w-full px-3 py-2 rounded-lg bg-[var(--tg-theme-secondary-bg-color)] border border-[var(--tg-theme-hint-color)]/40 focus:outline-none focus:border-[var(--tg-theme-button-color)]">
                </div>
                <div>
                    <label class="block text-sm mb-1 opacity-80">Осталось дней (аванс)</label>
                    <input type="number" id="days" min="0" max="365" placeholder="58" required
                        class="w-full px-3 py-2 rounded-lg bg-[var(--tg-theme-secondary-bg-color)] border border-[var(--tg-theme-hint-color)]/40 focus:outline-none focus:border-[var(--tg-theme-button-color)]">
                </div>
                <div>
                    <label class="block text-sm mb-1 opacity-80">Заметка (опционально)</label>
                    <textarea id="note" rows="2" placeholder="Например: Камера на парковке"
                        class="w-full px-3 py-2 rounded-lg bg-[var(--tg-theme-secondary-bg-color)] border border-[var(--tg-theme-hint-color)]/40 focus:outline-none focus:border-[var(--tg-theme-button-color)] resize-none"></textarea>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" id="cancel-btn" class="flex-1 py-2 rounded-lg bg-[var(--tg-theme-secondary-bg-color)]">Отмена</button>
                    <button type="submit" class="flex-1 py-2 rounded-lg bg-[var(--tg-theme-button-color)] text-[var(--tg-theme-button-text-color)] font-semibold">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="/src/app.js"></script>
</body>
</html>
